<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="google-site-verification" content="2Kx16kDKcXwz5l9UxD-gpTgHNdUySc_GNPjRwtK2WUA">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  {% if page.cover %}<meta property="og:image" content="{{ page.cover | absolute_url }}">{% endif %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <nav class="navbar">
    <a class="navbar-logo" href="/">Maike Osborne</a>
    <div class="navbar-links">
      <a href="/" {% if page.url == "/" %}aria-current="page"{% endif %}>Home</a>
      <a href="/talks/" {% if page.url == "/talks/" %}aria-current="page"{% endif %}>Talks</a>
      <a href="/media-articles/" {% if page.url == "/media-articles/" %}aria-current="page"{% endif %}>Media &amp; Articles</a>
      <a href="/mind-foundry/" {% if page.url == "/mind-foundry/" %}aria-current="page"{% endif %}>Mind Foundry</a>
      <a href="/contact/" {% if page.url == "/contact/" %}aria-current="page"{% endif %}>Contact</a>
    </div>
  </nav>

  {% if page.cover %}
  <header class="cover">
    <img src="{{ page.cover }}" alt="">
  </header>
  {% endif %}

  <main>
    {{ content }}
  </main>
</body>
</html>
